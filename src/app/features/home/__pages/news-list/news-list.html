<!-- გვერდის სათაური -->
<section class="page-head">
    <div class="page-head-inner">
        <p class="eyebrow">Modern Medical Solution</p>
        <h1>{{ 'NEWS_PAGE.TITLE' | translate }}</h1>
        <p class="subtitle">{{ 'NEWS_PAGE.SUBTITLE' | translate }}</p>
    </div>
    <div class="ribbon"><span></span><span></span><span></span></div>
</section>

<!-- სიახლეები -->
<section class="news-section">
    @if (news.length) {
        <div class="news-grid">
            @for (item of news; track item.id) {
                <app-news-card [news]="item" />
            }
        </div>
    } @else {
        <p class="empty">{{ 'NEWS_PAGE.EMPTY' | translate }}</p>
    }
</section>
