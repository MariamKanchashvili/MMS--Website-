<section class="news-page">
    <h1>{{ 'NEWS_PAGE.TITLE' | translate }}</h1>

    <div class="news-grid">
        @for (item of news; track item.id) {
            <a class="news-item" [routerLink]="['/news', item.id]">
                <div class="news-item-img">
                    <img [ngSrc]="item.image" fill alt="">
                </div>
                <p class="date">{{ item.date | date: 'dd.MM.yyyy' }}</p>
                <h3>{{ ('NEWS.' + item.id + '.TITLE') | translate }}</h3>
            </a>
        }
    </div>
</section>
